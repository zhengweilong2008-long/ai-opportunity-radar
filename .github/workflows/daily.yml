# AI 机会雷达 - 每日自动更新
#
# 每天 08:00（北京时间）= 00:00 UTC 自动运行：
#   采集 10 个信源 -> 评分 -> 导出 JSON -> 生成静态站 -> 提交数据 -> 发布到 GitHub Pages
#
# 注意：GitHub 免费版的定时任务在高峰期可能延迟几分钟到几十分钟，
# 不能保证精确在 08:00 整触发，这是 GitHub 的机制限制。
#
# 手动触发：仓库页面 Actions -> 每日更新 -> Run workflow（用于测试）

name: 每日更新

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write          # 提交每日数据文件
  pages: write             # 部署到 Pages
  id-token: write          # Pages 部署所需

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      # 可选：在仓库 Settings -> Secrets 里配置（建议配置 SEC 邮箱）
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      PH_TOKEN: ${{ secrets.PH_TOKEN }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 恢复数据库缓存（跨天去重用）
        uses: actions/cache@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: |
            radar-db-

      - name: 采集 10 个信源
        run: python scripts/collect.py

      - name: 评分（热度/机会/投资观察）
        run: python scripts/score.py

      - name: 中文翻译（MyMemory 免费 API，标题优先）
        run: python scripts/translate.py
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}  # 可选：填邮箱得 50000 字符/天

      - name: 导出 JSON 数据
        run: python scripts/export_json.py

      - name: 保存每日历史快照
        run: |
          mkdir -p data/history
          cp data/site-data.json "data/history/$(date +%F).json"

      - name: 构建静态网站
        run: python scripts/build_static.py

      - name: 运行测试
        run: python -m pytest tests/test_static.py -q

      - name: 提交数据文件
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/site-data.json data/history/
          git commit -m "每日数据更新 $(date +%F)" || echo "数据无变化，跳过提交"
          git push || echo "推送失败（可能无变化）"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
